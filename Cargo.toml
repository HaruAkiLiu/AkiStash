[package]
name = "akistash"
version = "1.0.0"
description = "AkiStash —— 二维 / 三维绘图软件"
authors = ["Aki"]
license = "MIT"
edition = "2021"

[lib]
name = "akistash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
